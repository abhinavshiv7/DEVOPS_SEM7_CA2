command[check_cpu]=/usr/lib/nagios/plugins/check_cpu -w 80 -c 90
command[check_memory]=/usr/lib/nagios/plugins/check_memory -w 80 -c 90
command[check_disk_root]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -p /
command[check_docker_stack]=/usr/lib/nagios/plugins/check_docker_stack
command[check_mongodb]=/usr/lib/nagios/plugins/check_docker_stack --service mongodb

