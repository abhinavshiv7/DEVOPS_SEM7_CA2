name: student-attendance-tracker

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/student_attendance_tracker
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in the deployment .env file}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://192.168.56.10:5173}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_MAX_AGE_MS: ${SESSION_MAX_AGE_MS:-604800000}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-192.168.56.10}:${FRONTEND_PORT:-5173}:80"

volumes:
  mongodb_data:

